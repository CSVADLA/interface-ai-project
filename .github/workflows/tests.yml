name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser integration tests
        env:
          MOCK_SEARCH_DELAY_MS: "0"
        run: |
          python -m flask --app apps.server run --port 5000 > flask.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail http://127.0.0.1:5000/ > /dev/null
          python -m pytest -q -m integration
